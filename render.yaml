# Render Blueprint - infrastructure as code for the CampusEats backend tier.
# Creating a Blueprint from this file provisions the API service and the
# managed PostgreSQL database together, and wires the connection string
# between them as an environment variable (never as code).
services:
  - type: web
    name: campuseats-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true            # Continuous Deployment on every push to main
    envVars:
      - key: ConnectionStrings__Default
        fromDatabase:
          name: campuseats-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true     # Render generates the production secret
      - key: Jwt__Issuer
        value: CampusEats
      - key: Jwt__Audience
        value: CampusEatsUsers
      - key: FRONTEND_ORIGIN
        value: https://campuseats-web-red.vercel.app
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

databases:
  - name: campuseats-db
    databaseName: campuseats
    plan: free
    region: singapore
